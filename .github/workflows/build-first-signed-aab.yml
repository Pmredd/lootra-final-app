# Lootra — Clean Release AAB Workflow

```yaml
name: Build Lootra Release AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-aab:
    name: Build Signed Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify Android project
        shell: bash
        run: |
          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew was not found."
            exit 1
          fi

          chmod +x gradlew

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: Missing ANDROID_KEYSTORE_BASE64"
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: Missing ANDROID_KEYSTORE_PASSWORD"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: Missing ANDROID_KEY_ALIAS"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: Missing ANDROID_KEY_PASSWORD"
            exit 1
          }

      - name: Restore existing signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lootra-upload-key.jks"

          if [ ! -s "$RUNNER_TEMP/lootra-upload-key.jks" ]; then
            echo "ERROR: Keystore restoration failed."
            exit 1
          fi

      - name: Verify keystore can be opened
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          keytool -list \
            -keystore "$RUNNER_TEMP/lootra-upload-key.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            >/dev/null

          echo "Existing signing keystore is readable."

      - name: Verify release signing configuration
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/lootra-upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          echo "Signing environment configured."
          echo "No new signing key will be generated."

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Build release AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/lootra-upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace --no-daemon

      - name: Find release AAB
        id: find_aab
        shell: bash
        run: |
          AAB_PATH=$(find . \
            -type f \
            -path "*/build/outputs/bundle/release/*.aab" \
            | head -n 1)

          if [ -z "$AAB_PATH" ]; then
            echo "ERROR: Release AAB was not found."
            exit 1
          fi

          echo "AAB generated successfully:"
          ls -lh "$AAB_PATH"

          echo "aab_path=$AAB_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lootra-Release-AAB
          path: ${{ steps.find_aab.outputs.aab_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup signing keystore
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/lootra-upload-key.jks"

          echo "Temporary signing keystore removed."
```

## Required GitHub Repository Secrets

Create/keep these four secrets:

* `ANDROID_KEYSTORE_BASE64`
* `ANDROID_KEYSTORE_PASSWORD`
* `ANDROID_KEY_ALIAS`
* `ANDROID_KEY_PASSWORD`

## Important

This workflow intentionally contains **NO**:

```text
keytool -genkeypair
```

It never creates a new signing key.

It restores the existing keystore temporarily, builds the AAB, uploads **only the AAB**, and deletes the temporary keystore.

## Required Gradle Signing Configuration

The existing `app/build.gradle.kts` must read:

```text
ANDROID_KEYSTORE_PATH
ANDROID_KEYSTORE_PASSWORD
ANDROID_KEY_ALIAS
ANDROID_KEY_PASSWORD
```

Do not hard-code signing passwords or keystore contents into the repository.

## Future releases

The same workflow can be reused for:

* version 1.2
* version 1.3
* version 1.4
* etc.

Only increase the app's `versionCode`/`versionName` when creating a new Play release.

Do not create another workflow and do not generate another signing key.

